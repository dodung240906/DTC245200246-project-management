services:
  postgres:
    image: postgres:15-alpine
    container_name: pm_postgres
    restart: unless-stopped
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net
    security_opt:
      - no-new-privileges:true

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pm_pgadmin
    restart: unless-stopped
    env_file: .env
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - backend_net
      - frontend_net
    security_opt:
      - no-new-privileges:true

  app:
    build: ./app
    container_name: pm_app
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      - postgres
    networks:
      - backend_net
      - frontend_net
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.25-alpine
    container_name: pm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - frontend_net
    security_opt:
      - no-new-privileges:true

volumes:
  pg_data:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

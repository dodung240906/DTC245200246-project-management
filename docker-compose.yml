services:
  postgres:
    image: postgres:15-alpine
    container_name: pm_postgres
    restart: unless-stopped
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net
    security_opt:
      - no-new-privileges:true

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pm_pgadmin
    restart: unless-stopped
    env_file: .env
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - backend_net
      - frontend_net
    security_opt:
      - no-new-privileges:true

  app:
    build: ./app
    container_name: pm_app
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      - postgres
    networks:
      - backend_net
      - frontend_net
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.25-alpine
    container_name: pm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - frontend_net
    security_opt:
      - no-new-privileges:true

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: pm_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      - postgres
    networks:
      - backend_net
    security_opt:
      - no-new-privileges:true

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: pm_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - backend_net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: pm_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    depends_on:
      - app
      - postgres-exporter
      - cadvisor
    networks:
      - backend_net
      - frontend_net
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:10.4.1
    container_name: pm_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file: .env
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - backend_net
      - frontend_net
    security_opt:
      - no-new-privileges:true

volumes:
  pg_data:
  prom_data:
  grafana_data:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

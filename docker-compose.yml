services:
  postgres:
    image: postgres:15-alpine
    container_name: pm_postgres
    restart: always
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pm_pgadmin
    restart: always
    env_file: .env
    environment:
      - PGADMIN_LISTEN_ADDRESS=0.0.0.0
      - PGADMIN_LISTEN_PORT=5050
    ports:
      - "5050:5050"
    depends_on:
      - postgres
    networks:
      - backend_net
      - frontend_net

  app:
    build: ./app
    container_name: pm_app
    restart: always
    env_file: .env
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      - postgres
    networks:
      - backend_net
      - frontend_net

  nginx:
    image: nginx:1.25-alpine
    container_name: pm_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - frontend_net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: pm_postgres_exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      - postgres
    networks:
      - backend_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: pm_cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - backend_net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: pm_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    depends_on:
      - app
      - postgres-exporter
      - cadvisor
    networks:
      - backend_net
      - frontend_net

  grafana:
    image: grafana/grafana:10.4.1
    container_name: pm_grafana
    restart: always
    ports:
      - "3001:3000"
    env_file: .env
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - backend_net
      - frontend_net

  loki:
    image: grafana/loki:2.9.2
    container_name: pm_loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - backend_net

  promtail:
    image: grafana/promtail:2.9.2
    container_name: pm_promtail
    restart: always
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - backend_net

volumes:
  pg_data:
  prom_data:
  grafana_data:
  loki_data:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
